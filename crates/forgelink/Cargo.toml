[package]
name = "forgelink"
version = "0.7.1"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Forge detection and URL generation for hosted git repositories"
readme = "README.md"
repository = "https://github.com/dpassen/forgelink"
keywords = ["git", "forge", "url", "github", "gitlab"]
categories = ["development-tools"]

[lints.clippy]
expect_used = "deny"
format_push_string = "warn"
indexing_slicing = "deny"
missing_errors_doc = "warn"
panic = "deny"
perf = { level = "warn", priority = -1 }
redundant_clone = "warn"
unwrap_used = "deny"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
dunce = "1"
gix = { version = "0.87", default-features = false, features = ["sha1"] }
iri-string = "0.7"
thiserror = "2"
url = "2"

[dev-dependencies]
tempfile = "3"
